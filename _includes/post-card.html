{% assign p = include.post %}
<li class="post-card" data-tags="{{ p.tags | join: ' ' }}">
  <a class="post-card-link" href="{{ p.url | relative_url }}">
    <span class="post-card-thumb">
      {% if p.image %}
        <img src="{{ p.image | relative_url }}" alt="" loading="lazy">
      {% else %}
        <span class="post-card-thumb-empty" aria-hidden="true">🧭</span>
      {% endif %}
    </span>
    <span class="post-card-title">{{ p.title }}</span>
    {% if p.description %}<span class="post-card-desc">{{ p.description }}</span>{% else %}<span class="post-card-desc">{{ p.excerpt | strip_html | strip_newlines | truncate: 70 }}</span>{% endif %}
  </a>
  <span class="post-card-meta">
    {% for t in p.tags %}<span class="tag">{{ t }}</span>{% endfor %}
    <time class="post-card-date" datetime="{{ p.date | date_to_xmlschema }}">{{ p.date | date: '%m.%d' }}</time>
  </span>
</li>
